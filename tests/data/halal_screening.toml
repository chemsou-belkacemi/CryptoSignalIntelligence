# FICHIER DE TEST (figé) : copie du relevé du 2026-09-30, pour tester le MÉCANISME d'admission sans dépendre du
# relevé courant (config/halal_screening.toml), qui change à chaque mise à jour des sources.
# Avis de screening halal relevés le 2026-09-30 sur trois sources publiques (docs/UNIVERSE.md).
# CE PROJET NE CERTIFIE LA CONFORMITÉ D'AUCUN ACTIF : la décision finale appartient au propriétaire.
#
# Avis par source : halal | douteux | haram | ambigu (contradictoire sur une même page : ni pour ni contre).
# Quand docs/UNIVERSE.md ne donne qu'un résumé, `resume` le reprend tel quel.
# Statut CSI, déduit mécaniquement (external/admission.py) :
#   FAVORABLE     halal pour au moins 2 sources, aucune douteuse ni haram   → ajout direct (paire USDT)
#   DEFAVORABLE   haram pour au moins une source                            → refus
#   DOUTEUX       douteuse pour au moins une source, ou avis contradictoires → décision du propriétaire
#   INEXPLOITABLE moins de 2 sources, ou screening non consigné             → décision du propriétaire
# Une crypto absente de ce fichier est INEXPLOITABLE.

