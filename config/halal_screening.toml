# Avis de screening halal relevés le 2026-10-01 sur trois sources publiques (docs/UNIVERSE.md), par extraction
# directe du HTML de chaque page (instantané : docs/universe_sources/2026-10-01.json).
# CE PROJET NE CERTIFIE LA CONFORMITÉ D'AUCUN ACTIF : la décision finale appartient au propriétaire.
#
# Avis par source : halal | douteux (« grey area ») | haram (« Halal? No »).
#   HS  = HalalSignalz, liste des cryptos qui passent son filtre (les autres n'y figurent pas) ;
#   SB  = SharifBot, halal ou zone grise ;
#   IFG = Islamic Finance Guru, colonne « Halal? » de son tableau.
# Statut CSI, déduit mécaniquement (external/admission.py) :
#   FAVORABLE     halal pour au moins 2 sources, aucune douteuse ni haram   → ajout direct (paire USDT)
#   DEFAVORABLE   haram pour au moins une source                            → refus
#   DOUTEUX       douteuse pour au moins une source                         → décision du propriétaire
#   INEXPLOITABLE moins de 2 sources halal, ou aucune source                → décision du propriétaire
# Relevé : cryptos ayant une paire USDT négociable sur Binance Spot et listées par une source au moins, plus
# les paires liquides (volume médian 7 j d'au moins 5 M$) qu'aucune source ne liste. Stablecoins et monnaies
# fiduciaires exclus. Une crypto absente de ce fichier est INEXPLOITABLE (traitée quand un signal arrive).

