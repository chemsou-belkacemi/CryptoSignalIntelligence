# Configuration par défaut. Surcharges : variables CSI_* (voir .env.example),
# ou un autre fichier via CSI_CONFIG_FILE. Toutes les valeurs de stratégie et de
# coût sont des HYPOTHÈSES EXPÉRIMENTALES, pas des réglages optimaux.

[project]
# Données publiques du marché réel Binance Spot (pas la démo).
market_data_source = "BINANCE_SPOT_PUBLIC"
# Environnement où un consommateur POURRAIT exécuter ; ce projet n'exécute rien.
intended_execution_environment = "DEMO"

[data]
# Univers courant : docs/UNIVERSE.md (screening halal croisé sur 3 sources publiques + disponibilité
# Binance Spot vérifiée le 2026-09-30). Ce projet ne certifie rien : liste à valider par l'utilisateur.
# Ordre = volume 24 h décroissant à la date de vérification. BTCUSDT sert aussi de contexte de marché.
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "NEARUSDT", "AVAXUSDT", "HBARUSDT", "LINKUSDT",
           "XLMUSDT", "ADAUSDT", "TRXUSDT", "FILUSDT", "ALGOUSDT", "DOTUSDT", "ATOMUSDT", "ETCUSDT"]
setup_timeframe = "15m"
context_timeframe = "1h"
# 4h et 5m sont prévus dans les interfaces mais désactivés tant que leurs
# jointures temporelles n'ont pas été validées.
enabled_timeframes = ["15m", "1h"]
history_start = "2021-01-01"
archive_base_url = "https://data.binance.vision"
rest_base_url = "https://data-api.binance.vision"
# Hypothèse de disponibilité historique : une bougie est utilisable
# close_time + 1 ms + cette latence (aucune heure de réception réelle connue).
assumed_availability_latency_seconds = 2
# Bougies récentes re-téléchargées à chaque mise à jour pour réconciliation.
reconcile_overlap_bars = 3
# Données plus vieilles que N intervalles au moment d'une analyse : STALE_DATA.
max_staleness_bars = 2
# Décisions bloquées pendant N bougies après un trou (indicateurs contaminés).
gap_block_bars = 200
# Taille de pas de prix du marché de données, relevée le 2026-09-30 (vérifiée par `doctor`).
# Les filtres de la démo peuvent différer : le consommateur revalide. Binance modifie parfois
# ces pas : les niveaux historiques sont arrondis au pas actuel (limite documentée).
[data.tick_size]
BTCUSDT = "0.01"
ETHUSDT = "0.01"
SOLUSDT = "0.01"
XRPUSDT = "0.0001"
NEARUSDT = "0.001"
AVAXUSDT = "0.001"
HBARUSDT = "0.00001"
LINKUSDT = "0.001"
XLMUSDT = "0.0001"
ADAUSDT = "0.0001"
TRXUSDT = "0.0001"
FILUSDT = "0.0001"
ALGOUSDT = "0.0001"
DOTUSDT = "0.001"
ATOMUSDT = "0.001"
ETCUSDT = "0.01"

[regimes]
volatility_window_bars = 720      # 30 jours de 1h, passé uniquement
volatility_min_bars = 240
volatility_low_quantile = 0.2
volatility_high_quantile = 0.8
liquidity_window_bars = 720
liquidity_min_bars = 240
liquidity_low_ratio = 0.3         # volume 24h < 30 % de sa médiane passée → LOW
liquidity_min_quote_volume_24h = 5000000
transition_lookback_bars = 6

[protocol]
# Fixé AVANT toute optimisation. Le test final n'est consulté qu'explicitement
# (--i-understand-final-test) et chaque consultation est enregistrée. Bornes figées dans
# research/protocol.py : development_end peut être plus tôt ici, jamais plus tard.
development_end = "2025-06-30T23:59:59Z"
final_test_start = "2025-07-01T00:00:00Z"
bootstrap_block_days = 10
bootstrap_samples = 2000
seed = 20260929

[simulation]
# Décision à la clôture ; le signal existe à close + latence ; l'entrée est
# possible au plus tôt à l'ouverture de la bougie suivante.
max_hold_bars = 96                # 24 h en 15m ; sortie au close (profil théorique)
risk_fraction_per_trade = 0.005   # courbe « signaux indépendants », informative

[costs.central]
# 7,5 pb par ordre depuis le 2026-10-03 : tarif Spot de base (10 pb) avec la remise de 25 % des frais payés en BNB,
# que le propriétaire utilise. Avant : 10 pb ; chaque exécution enregistrée garde le scénario de son époque.
# Le défavorable reste à 10 pb (remise absente, par exemple solde BNB épuisé ou environnement Demo sans remise).
fee_bps = 7.5
slippage_bps = 2
half_spread_bps = 1
extra_entry_delay_bars = 0

[costs.adverse]
fee_bps = 10
slippage_bps = 5
half_spread_bps = 3
# Une bougie de retard (2026-09-30, après l'audit look-ahead) : en direct, le signal part ≈ 40 s
# après la clôture et l'ordre après sa lecture par le consommateur ; le central garde 0.
extra_entry_delay_bars = 1

[costs.stress]
fee_bps = 15
slippage_bps = 10
half_spread_bps = 5
extra_entry_delay_bars = 1

[publication]
mode = "shadow"                   # shadow uniquement au lot 1
shadow_dir = "signals/shadow"
outbox_dir = "signals/outbox"
outbox_enabled = false            # exige aussi integration_verified = true
integration_verified = false
entry_tolerance_bps = 25          # MAX_ENTRY_DEVIATION_BPS = écart réel référence → ENTRY_1 + 25 pb
message_ttl_minutes = 15          # EXPIRES_AT : fin d'acceptation du message (≤ ENTRY_EXPIRES_AT)
# Hors shadow, seules ces politiques partent (le consommateur les exécute à l'identique, même empreinte).
consumer_policies = ["BSM_MARKET_TP_FIXED_SL_V2", "BSM_MARKET_TP_BREAK_EVEN_V2"]

[strategies.DONCHIAN_VOLUME_BREAKOUT]
version = 1
status = "RESEARCH"
lookback_bars = 20
volume_window_bars = 20
volume_multiple = 1.5
use_volume_filter = true
require_bull_context = true
max_distance_atr = 0.5            # clôture au plus 0,5 ATR au-dessus du niveau
stop_atr = 1.5
target_r = 2.0
entry_max_deviation_bps = 10      # limite = référence × (1 + 10 bps)
entry_expiry_bars = 2
min_net_rr = 1.2                  # RR TP1 net de coûts centraux minimal

[strategies.EMA_PULLBACK_CONTINUATION]
version = 1
status = "RESEARCH"
pullback_bars = 4                 # fenêtre du plus bas de repli (bougie courante incluse)
zone_atr = 0.25                   # haut de zone = EMA20 + 0,25 ATR
max_depth_atr = 1.5               # repli plus profond sous l'EMA20 : refus
stop_buffer_atr = 0.25
max_risk_atr = 3.0
target_r = 2.0
require_bull_context = true
entry_max_deviation_bps = 10
entry_expiry_bars = 2
min_net_rr = 1.2

[strategies.RANGE_REENTRY]
version = 1
status = "RESEARCH"
bb_k = 2.0                        # Bollinger(20), écart-type de population
extreme_bars = 3                  # stop sous le plus bas des 3 dernières bougies
stop_buffer_atr = 0.5
min_band_width_pct = 0.5          # bande totale < 0,5 % du centre : range trop étroit
require_range_context = true
use_btc_filter = true
btc_max_drop_24h_pct = 3.0
use_rsi_filter = false            # extension testée séparément (variante avec_filtre_rsi)
rsi_max = 35
entry_max_deviation_bps = 10
entry_expiry_bars = 2
min_net_rr = 0.8                  # cible au centre de bande : RR plus court, hypothèse à tester

[walk_forward]
# Fixé le 2026-09-30 AVANT le premier walk-forward (docs/PROTOCOL.md).
train_min_months = 18             # entraînement ancré : début de période → début du test
test_months = 6                   # fenêtres de test successives, sans chevauchement
min_train_trades = 30             # en dessous, une combinaison n'est pas sélectionnable

[admission]
# Critères de docs/PROTOCOL.md, déclarés avant les tests.
min_closed_trades = 150
min_windows_with_trades = 3
max_group_pnl_share = 0.6         # part maximale du PnL en R portée par une paire ou une année
max_drawdown_r = 15

[risk]
# Limites d'exposition CENTRALISÉES (docs/ML_INTRADAY.md §5) : communes à toutes les stratégies et à
# toutes les paires, positions déjà ouvertes comprises. Fractions du capital réalisé ; spot sans levier.
position_fraction = 0.10          # taille d'une position
max_positions = 5
max_total_exposure = 0.50
max_asset_exposure = 0.10         # par paire, toutes stratégies confondues (une position par paire)
max_strategy_exposure = 0.50      # par stratégie
daily_loss_limit = 0.03           # perte du jour UTC au-delà de laquelle plus aucune entrée

[external]
# Évaluation des signaux externes (groupes Telegram) : docs/EXTERNAL_SIGNALS.md. Hypothèses explicites.
entry_window_bars = 96            # ordre LIMIT valable 24 h (comportement de BinanceSpotManager)
max_hold_bars = 672               # horizon de résolution : 7 jours de 15m (TP1 ou SL, sinon TIMEOUT)
max_entry_deviation_pct = 3.0     # entrée plus de 3 % AU-DESSUS du dernier prix : signal périmé
min_stop_atr = 0.5                # stop plus serré que 0,5 ATR14 : bruit de marché
max_stop_atr = 8.0                # stop plus large que 8 ATR14 : risque incontrôlé
min_net_rr = 0.8                  # RR TP1 net de coûts centraux minimal
min_base_rate_samples = 300       # en dessous : taux de base sur tous les régimes, puis INDETERMINE
management = "stop_suiveur"      # gestion jugée : stop à l'entrée 1 après TP1, puis à TP(k−2) après TPk ; "tp1" sinon
tp_count = 5                      # objectifs vendus (parts 33/27/20/13/7 %), comme le réglage de BinanceSpotManager
trail_max_hold_bars = 2880        # au-delà de 30 jours, le reste est vendu (BinanceSpotManager n'a pas de limite)
auto_add_pairs = false            # mode test : toute paire soumise est ajoutée, même sans validation manuelle
                                  # (CSI_EXTERNAL__AUTO_ADD_PAIRS=true ; Docker : CSI_AUTO_ADD_PAIRS dans .env)

[derivatives]
# Données PUBLIQUES du marché à terme USDⓈ-M de Binance (docs/DERIVATIVES.md) : financement, prime,
# intérêt ouvert, ratios acheteurs/vendeurs. Information sur le positionnement seulement : CSI ne négocie
# aucun contrat à terme, sans clé, et les signaux restent des achats Spot de l'univers.
rest_base_url = "https://fapi.binance.com"
live_cache_seconds = 300          # tableau de bord : une paire relue au plus toutes les 5 min
# Historique (recherche) : disponibilité supposée, prudente (aucune heure de publication réelle connue).
funding_latency_seconds = 60      # financement : connu 1 min après son règlement
metrics_latency_seconds = 602     # metrics 5 min : l'archive date chaque valeur 5 min AVANT l'API publique
                                  # (vérifié le 2026-10-01) ; prudence : connue 10 min + 2 s après
