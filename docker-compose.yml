# CryptoSignalIntelligence : surveillance shadow sur un seul hôte (PC, VPS ou NAS x86-64/arm64).
#
# - Un seul réplica : un verrou d'instance empêche deux publications simultanées.
# - Volume nommé local (pas de partage réseau : SQLite et les verrous de fichiers exigent un seul noyau).
# - Arrêt propre : SIGTERM → le cycle en cours se termine, puis sortie.
# - Aucune clé, aucune route vers les ordres Binance ; ports publiés sur 127.0.0.1 seulement
#   (tableau de bord 8502, API de lecture et d'évaluation 8503).

name: crypto-signal-intelligence

x-app: &app
  build: .
  image: crypto-signal-intelligence:latest
  init: true
  volumes:
    - csi-state:/srv/csi
  environment:
    # Univers : toute paire soumise est ajoutée (choix du propriétaire, 2026-10-01, docs/UNIVERSE.md) ;
    # CSI_AUTO_ADD_PAIRS=false dans .env pour revenir à « seule la soumission manuelle ajoute une paire ».
    CSI_EXTERNAL__AUTO_ADD_PAIRS: ${CSI_AUTO_ADD_PAIRS:-true}
  restart: unless-stopped
  # Limites : la surveillance tient dans ~500 Mo ; les travaux lourds passent par `tools`.
  mem_limit: 1g
  cpus: 1.0

services:
  monitor:
    <<: *app
    command: ["python", "-m", "crypto_signal_intelligence", "run", "--mode", "shadow"]
    # Lecture OCR des signaux Telegram en image (modèles chargés une fois) : quelques centaines de Mo de plus.
    mem_limit: 2g
    volumes:
      - csi-state:/srv/csi
      # Boîte de réception de BinanceSpotManager (messages Telegram reçus en direct par son bot), LECTURE SEULE :
      # source du test F4_TELEGRAM. Volume créé par BSM (`make up`) ; CSI n'y écrit jamais.
      - binance-spot-manager_bsm-data:/srv/bsm-data:ro
    environment:
      CSI_EXTERNAL__AUTO_ADD_PAIRS: ${CSI_AUTO_ADD_PAIRS:-true}
      CSI_FORWARD__BSM_INBOX: /srv/bsm-data/signals.sqlite3
    # Plafond (pas une réservation) : un cycle ne dure que quelques secondes toutes les 15 min ;
    # 4 CPU laissent les 4 rafraîchissements parallèles de bougies tourner sans se gêner.
    cpus: 4.0
    # Un cycle peut attendre des bougies jusqu'à 90 s : laisser le temps de finir.
    stop_grace_period: 180s

  # Tableau de bord : http://127.0.0.1:8502/dashboard.html (ce PC uniquement, lecture seule).
  dashboard:
    image: crypto-signal-intelligence:latest
    init: true
    restart: unless-stopped
    depends_on:
      - monitor
    volumes:
      - csi-state:/srv/csi:ro
    command: ["python", "-m", "http.server", "8502", "--bind", "0.0.0.0", "--directory", "/srv/csi/state"]
    ports:
      - "127.0.0.1:${CSI_DASHBOARD_PORT:-8502}:8502"
    # Sa santé = le serveur répond (la santé de la surveillance est celle du service monitor).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
    mem_limit: 128m
    cpus: 0.25

  # API locale (lecture et évaluation seulement) : http://127.0.0.1:8503/health
  # Tableau de bord interactif de CSI (indépendant de BSM) : http://127.0.0.1:8503/ (ce PC uniquement).
  # Pour l'interface de BinanceSpotManager : réseau Docker « csi-bridge », adresse http://csi-api:8503.
  # Jeton facultatif : CSI_API_TOKEN dans l'environnement (fichier .env à côté de ce fichier, jamais versionné).
  api:
    image: crypto-signal-intelligence:latest
    init: true
    restart: unless-stopped
    depends_on:
      - monitor
    volumes:
      - csi-state:/srv/csi          # écriture : les évaluations sont enregistrées puis résolues par monitor
      # Registre de RECHERCHE du PC (sélections ML lancées hors Docker), en lecture seule, pour l'onglet Suivi.
      - ./experiments:/srv/research:ro
      # Exports de Telegram Desktop faits AVEC les photos (un sous-dossier par groupe, copié par le propriétaire
      # dans ./exports, créé par `mkdir -p exports` AVANT le premier démarrage) : audit avec lecture des images
      # depuis le tableau de bord (docs/OCR.md). Lecture seule ; le reste du volume n'est pas exposé à l'hôte.
      - ./exports:/srv/csi/exports:ro
    environment:
      CSI_RESEARCH_REGISTRY: /srv/research/experiments.sqlite3
      CSI_API_TOKEN: ${CSI_API_TOKEN:-}
      CSI_EXTERNAL__AUTO_ADD_PAIRS: ${CSI_AUTO_ADD_PAIRS:-true}
    command: ["python", "-m", "crypto_signal_intelligence.api", "--host", "0.0.0.0", "--port", "8503"]
    ports:
      - "127.0.0.1:${CSI_API_PORT:-8503}:8503"
    networks:
      default: {}
      csi-bridge:
        aliases: ["csi-api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; r = u.Request('http://127.0.0.1:8503/health'); t = os.environ.get('CSI_API_TOKEN'); t and r.add_header('Authorization', 'Bearer ' + t); u.urlopen(r, timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
    # Audit d'un export avec lecture des images (modèles OCR chargés, milliers de photos) : même marge que monitor.
    mem_limit: 2g
    cpus: 1.0

  # Outils ponctuels (même volume) : téléchargement initial, sauvegarde, walk-forward…
  #   docker compose run --rm tools download
  #   docker compose run --rm tools backup
  tools:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    mem_limit: 2g
    volumes:
      - csi-state:/srv/csi
      # Mêmes exports que le service api :
      # `docker compose run --rm tools audit-telegram --dir "/srv/csi/exports/<groupe>" --ocr`.
      - ./exports:/srv/csi/exports:ro
    entrypoint: ["python", "-m", "crypto_signal_intelligence"]
    command: ["doctor"]

  # Relais Telegram → F4 (docs/TELEGRAM_RELAY.md) : lit le DEUXIÈME bot du propriétaire et dépose les messages dans
  # l'entrée en direct de F4. Ne démarre que sur demande : `docker compose --profile telegram up -d telegram-relay`.
  # Le jeton du bot vient du fichier .env (CSI_TELEGRAM_RELAY_TOKEN), jamais du code ni de ce fichier ; seul ce
  # service le reçoit.
  telegram-relay:
    image: crypto-signal-intelligence:latest
    init: true
    profiles: ["telegram"]
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - csi-relay:/srv/relay        # décalage Telegram et messages en attente si l'API est arrêtée
    environment:
      CSI_TELEGRAM_RELAY_TOKEN: ${CSI_TELEGRAM_RELAY_TOKEN:-}
      CSI_TELEGRAM_RELAY_CHATS: ${CSI_TELEGRAM_RELAY_CHATS:-}
      CSI_TELEGRAM_RELAY_API: http://csi-api:8503
      CSI_API_TOKEN: ${CSI_API_TOKEN:-}
      # Sens retour (appels de l'assistant au propriétaire, docs/TELEGRAM_RELAY.md) : vide = propriétaire reconnu
      # automatiquement par ses transferts (gardé dans le volume csi-relay) ; sur le VPS, poser la valeur dans .env.
      CSI_TELEGRAM_OWNER_CHAT_ID: ${CSI_TELEGRAM_OWNER_CHAT_ID:-}
    command: ["python", "-m", "crypto_signal_intelligence.relay.telegram"]
    # Le contrôle de santé de l'image vise la surveillance (cycle du scanner) : sans objet pour le relais, qui
    # signale ses pannes dans son journal et redémarre seul.
    healthcheck:
      disable: true
    networks:
      default: {}
      csi-bridge: {}
    mem_limit: 128m
    cpus: 0.25

  # Intégration Demo (DÉSACTIVÉE) : ne rien monter du volume de BinanceSpotManager tant que
  # `integration_verified` est false (docs/SIGNAL_FORMAT.md). Le jour venu, et seulement après
  # fusion de la branche BSM par son propriétaire :
  #   volumes:
  #     - binance-spot-manager_bsm-data:/srv/bsm-data
  #   environment:
  #     CSI_PUBLICATION__OUTBOX_DIR: /srv/bsm-data/signal_drop/incoming

volumes:
  csi-state:
  csi-relay:
  # Volume de données de BinanceSpotManager, lu par `monitor` (F4_TELEGRAM) ; il doit exister (`make up` côté BSM).
  binance-spot-manager_bsm-data:
    external: true

networks:
  default: {}
  # Réseau partagé avec BinanceSpotManager, créé une fois (`docker network create csi-bridge`,
  # fait par scripts/docker-init.ps1 et par `make network` côté BSM) : aucun des deux projets ne
  # le possède ni ne le supprime, chacun peut démarrer ou s'arrêter sans casser l'autre.
  csi-bridge:
    name: csi-bridge
    external: true
