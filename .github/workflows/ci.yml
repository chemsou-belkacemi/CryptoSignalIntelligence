# Contrôles à chaque envoi et chaque demande de fusion : tests, lint, types, garde-fou anti-secrets.
# Aucun secret, aucune clé, aucun accès réseau vers Binance (tests « network » exclus).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # pylock.toml a été verrouillé sous Windows : mêmes versions, extraites en contraintes (comme le Dockerfile).
      - name: Installer (versions de pylock.toml)
        run: |
          python -c "import tomllib; d = tomllib.load(open('pylock.toml', 'rb')); open('constraints.txt', 'w').write(''.join(f\"{p['name']}=={p['version']}\n\" for p in d['packages'] if 'version' in p))"
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev,ml]"

      - name: Tests (sans réseau)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -m "not network"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Types (mypy)
        run: mypy
