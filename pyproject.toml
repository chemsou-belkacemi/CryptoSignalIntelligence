[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-intelligence"
version = "0.1.0"
description = "Données → recherche → analyse → validation → signaux TXT. Aucune exécution d'ordre."
readme = "README.md"
requires-python = ">=3.12"
# Versions minimales vérifiées par installation réelle sous Python 3.14.7 (Windows, 2026-09-30).
# Les versions exactes installées sont figées dans pylock.toml.
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "pyarrow>=21",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "typer>=0.16",
    "rich>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12", "mypy>=1.17", "pyright>=1.1.400"]
# Lot 5 bis (ML intraday, docs/ML_INTRADAY.md) : modèles à arbres comparés à la logistique de référence.
# Hors de l'image Docker de surveillance (elle n'entraîne rien).
ml = ["lightgbm>=4.6", "xgboost>=3.0"]
# Groupes des lots suivants, ajoutés à leur étape : agents, streaming, reports.

[project.scripts]
csi = "crypto_signal_intelligence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crypto_signal_intelligence.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["network: nécessite un accès Internet (exclus par défaut : -m 'not network')"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer.Option dans les valeurs par défaut est l'idiome documenté de typer.
"src/crypto_signal_intelligence/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/crypto_signal_intelligence"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pyright]
# Serveur de langage (éditeur, plugin pyright-lsp) : navigation, imports introuvables, syntaxe.
# Le contrôle de types reste mypy : en mode « basic », pyright signale ~300 faux positifs dus aux
# stubs pandas / pyarrow / pydantic-settings (relevé du 2026-09-30), qui noieraient les vrais.
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportMissingImports = "error"
reportUndefinedVariable = "error"
