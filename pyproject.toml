[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-intelligence"
version = "0.1.0"
description = "Données → recherche → analyse → validation → signaux TXT. Aucune exécution d'ordre."
readme = "README.md"
requires-python = ">=3.12"
# Versions minimales vérifiées par installation réelle sous Python 3.14.7 (Windows, 2026-09-30).
# Les versions exactes installées sont figées dans pylock.toml.
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "pyarrow>=21",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "typer>=0.16",
    "rich>=14",
    # Screening halal des tests en direct (config/halal_screen.yaml, format demandé par le propriétaire).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12", "mypy>=1.17", "pyright>=1.1.400"]
# Lots 5 bis et 5 ter (ML intraday et swing, docs/ML_INTRADAY.md, docs/ML_SWING.md) : modèles à arbres
# comparés à la logistique de référence. Hors de l'image Docker de surveillance (elle n'entraîne rien).
ml = ["lightgbm>=4.6", "xgboost>=3.0", "catboost>=1.2", "scipy>=1.15"]
# Service (image Docker) : seul LightGBM est nécessaire, pour la volatilité prévue (outlook/volatility.py).
forecast = ["lightgbm>=4.6"]
# Recherche (plan de travail du 2026-10-03, validé par le propriétaire) : intervalles et références de volatilité
# (arch), simulation au niveau du carnet d'ordres (hftbacktest, numba), cotations multi-bourses en LECTURE SEULE
# (ccxt : jamais de clé, jamais d'ordre ; le relevé en service passe par la liste blanche de forward/sources.py).
# Hors de l'image Docker de surveillance.
research = ["arch>=8.0", "hftbacktest>=2.4", "numba>=0.68", "ccxt>=4.5"]
# Signaux Telegram publiés en image (docs/OCR.md) : lecture locale pour l'audit des groupes. Tesseract (tesserocr)
# reste facultatif. Versions épinglées : elles entrent dans l'empreinte de lecture de F16 (chart_ocr.reader_fingerprint).
ocr = ["opencv-python==5.0.0.93", "rapidocr==3.9.2", "onnxruntime==1.30.0", "omegaconf==2.3.1"]
# CNN sur images de graphiques (docs/CNN.md) : recherche seulement, hors de l'image Docker et du CI (tests sautés sans
# torch). Sur PC, la version CPU : pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
cnn = ["torch==2.14.1"]
# Groupes des lots suivants, ajoutés à leur étape : agents, streaming, reports.

[project.scripts]
csi = "crypto_signal_intelligence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crypto_signal_intelligence.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["network: nécessite un accès Internet (exclus par défaut : -m 'not network')"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer.Option dans les valeurs par défaut est l'idiome documenté de typer.
"src/crypto_signal_intelligence/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/crypto_signal_intelligence"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pyright]
# Serveur de langage (éditeur, plugin pyright-lsp) : navigation, imports introuvables, syntaxe.
# Le contrôle de types reste mypy : en mode « basic », pyright signale ~300 faux positifs dus aux
# stubs pandas / pyarrow / pydantic-settings (relevé du 2026-09-30), qui noieraient les vrais.
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportMissingImports = "error"
reportUndefinedVariable = "error"
